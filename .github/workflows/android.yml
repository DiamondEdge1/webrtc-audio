# Builds the audio-only Android AAR (android/build.sh). WebRTC's Android build needs a Linux host, which is
# why this runs here rather than on the Mac that builds iOS. Started by hand; with `release` set, the AAR is
# attached to that existing release (the tag the iOS framework was published under).
name: Android AAR

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to attach the AAR to (empty = workflow artifact only)
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    # Sync (~30 min) plus four ABIs; well under the 6-hour job limit, and a hung build stops here.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      # The WebRTC Android checkout is ~30 GB with its NDK and SDK; the stock image leaves ~14 GB free.
      # These preinstalled toolchains are unused here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Sync WebRTC
        env:
          WEBRTC_WORK: ${{ runner.temp }}/webrtc
          WEBRTC_INSTALL_DEPS: "1"
        run: android/build.sh sync

      - name: Build AAR
        env:
          WEBRTC_WORK: ${{ runner.temp }}/webrtc
        run: android/build.sh build

      - uses: actions/upload-artifact@v4
        with:
          name: webrtc-audio-android
          path: ${{ runner.temp }}/webrtc/out/webrtc-audio-android-*.aar
          if-no-files-found: error

      - name: Attach to release
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          OUT: ${{ runner.temp }}/webrtc/out
        run: gh release upload "$RELEASE" "$OUT"/webrtc-audio-android-*.aar
